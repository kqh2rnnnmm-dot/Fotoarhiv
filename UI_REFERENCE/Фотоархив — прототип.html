const stat=(i,value,label)=>`<div class="stat"><div class="stat-icon">${icon(i)}</div><div><strong>${value}</strong><small>${label}</small></div></div>`;
function shell(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">${icon('images',21)}</div><span class="brand-name">фотоархив<span style="color:#366df3">.</span></span></div><div class="nav-title">Библиотека</div><nav class="nav">${nav.map(([id,ic,name])=>`<button data-go="${id}" class="${state.section===id?'active':''}" aria-label="${name}">${icon(ic)}<span class="nav-label">${name}</span>${id==='duplicates'?'<span class="notify-count">12</span>':''}</button>`).join('')}</nav><div class="side-group"><div class="nav-title">Подключено</div><div class="sides"><div class="source-row">${icon('harddrive')} Диск C <span class="dot"></span></div><div class="source-row">${icon('harddrive')} Диск D <span class="dot"></span></div><div class="source-row">${icon('harddrive')} Внешний диск <span style="margin-left:auto;color:#b5a17c">○</span></div></div></div><div class="side-bottom"><span class="demo-pill"><span></span> Демо интерфейса</span><p class="side-caption">Все фото и цифры вымышленные. Никакие файлы не изменяются.</p></div></aside><main class="main"><header class="topbar"><div class="search">${icon('search')}<input id="searchInput" placeholder="Найти по дате, месту или названию…" value="${escapeHtml(state.query)}" autocomplete="off" aria-label="Поиск фотографий"></div><div class="actions"><button class="btn" id="addFolder">${icon('plus')}<span>Добавить папку</span></button><button class="btn primary" id="openArchive">${icon('download')}<span>Собрать архив</span></button></div></header><div class="viewport" id="viewport">${page()}</div></main>${state.detail!=null?detailPanel():''}${state.modal?modal():''}<div id="toastHost"></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function heading(title,subtitle){return `<div class="page-title"><div><h1>${title}</h1><div class="subtitle">${subtitle}</div></div><div class="head-note">${icon('shield')} Оригиналы под защитой</div></div>`}
function photoCard(p){return `<button class="photo-card" data-photo-card data-id="${p.id}" title="${p.name} · ${p.city}"><img loading="lazy" src="${ASSETS[p.img]}" alt="Демо-снимок ${escapeHtml(p.name)}">${p.stack?`<div class="stack">${icon('layers')} ${p.stack}</div>`:''}<div class="overlay">${p.city!=='Неизвестно'?p.city+' · ':''}${p.date}</div></button>`}
function displayedPhotos(){return photos.filter(p=>(state.year==='Все годы'||p.year===Number(state.year))&&(!state.query||[p.name,p.city,p.country,p.date,p.year,p.source].join(' ').toLowerCase().includes(state.query.toLowerCase())))}
function photoPage(){const filtered=displayedPhotos();const grouped={};filtered.forEach(p=>{let k=p.month+' '+p.year;(grouped[k]??=[]).push(p)});let sections=Object.entries(grouped).map(([d,list])=>`<section class="timeline-section"><div class="dateheading"><h2>${d}</h2><span>${list.length} снимков в демонстрации</span></div><div class="photos-grid">${list.map(photoCard).join('')}</div></section>`).join('');return `${heading('Фотографии','Вся коллекция в одной хронологии — независимо от папки и диска.')}<div class="stats">${stat('images','1 284','Фотографии в каталоге')}${stat('layers','128','Повторяющихся снимков')}${stat('map','4','Места съёмки')}${stat('harddrive','3','Подключённых источника')}</div><div class="toolbar">${['Все годы','2024','2023','2022','2021','2019'].map(y=>`<button class="chip ${state.year===y?'active':''}" data-year="${y}">${y}</button>`).join('')}<span class="spacer"></span><span class="mini-control">${icon('filter')} Сначала новые</span></div>${sections||`<div class="empty"><div>${icon('search',32)}<h3>Ничего не найдено</h3><p>Попробуйте другое название, место или год.</p></div></div>`}${state.imported.length?`<section class="timeline-section"><div class="dateheading"><h2>Выбранные файлы</h2><span>${state.imported.length} · только предпросмотр в браузере</span></div><div class="photos-grid">${state.imported.slice(0,20).map((p,i)=>`<div class="photo-card"><img src="${p.url}" alt="${escapeHtml(p.name)}"><div class="overlay">${escapeHtml(p.name)}</div></div>`).join('')}</div></section>`:''}`}
function mapPage(){return `${heading('Места съёмки','Фотографии с координатами EXIF — на одной карте.')}<div class="toolbar">${['Все годы','2024','2023','2022','2021','2019'].map(y=>`<button class="chip ${state.year===y?'active':''}" data-year="${y}">${y}</button>`).join('')}<span class="spacer"></span><span class="mini-control">${icon('pin')} Координаты из фотографий</span></div><div class="map-layout"><div class="map-card"><div class="map-top"><strong>Карта коллекции</strong><span>Демонстрационные точки</span></div><svg class="map-svg" viewBox="0 0 900 545" aria-label="Схематичная карта мира"><defs><pattern id="mapgrid" width="56" height="52" patternUnits="userSpaceOnUse"><path d="M 56 0 L 0 0 0 52" fill="none" stroke="#dce8f3" stroke-width="1"/></pattern></defs><rect width="900" height="545" rx="15" fill="#e6f1f6"/><rect width="900" height="545" fill="url(#mapgrid)"/><g fill="#d5e4dc" stroke="#bfd4c8" stroke-width="1.5" opacity=".98"><path d="M81 108 130 58 197 58 238 84 260 121 255 165 226 201 207 230 183 219 171 174 146 176 113 152Z"/><path d="M198 250 241 237 272 260 267 304 287 328 271 384 256 425 227 461 211 426 220 372 201 332 193 291Z"/><path d="M383 113 404 86 428 80 463 99 465 123 440 140 431 163 416 156Z"/><path d="M411 191 461 170 503 192 517 247 487 316 472 373 436 394 416 360 409 311 391 258Z"/><path d="M462 99 510 70 591 63 669 79 716 111 750 131 773 187 739 225 694 200 661 230 618 241 582 219 538 234 517 205 475 174 452 145Z"/><path d="M729 343 758 326 795 336 827 370 812 410 777 423 741 396Z"/><path d="M766 223 775 219 789 236 781 253Z"/><path d="M558 262 572 249 581 264 569 276Z"/></g><g fill="#9fbac3" opacity=".5"><circle cx="86" cy="490" r="2"/><circle cx="462" cy="495" r="3"/><circle cx="768" cy="483" r="2"/></g>${cities.map((c,i)=>`<g class="map-marker" data-city="${i}" transform="translate(${c.x*9},${c.y*5.45})"><circle r="${i===state.selectedCity?15:11}" fill="${i===state.selectedCity?'#346af3':'#fff'}" stroke="#346af3" stroke-width="4"/><circle r="3" fill="${i===state.selectedCity?'#fff':'#346af3'}"/></g>`).join('')}</svg><div class="map-top" style="margin-top:-7px"><span>Масштабная география — в рабочей версии</span><span>По данным EXIF</span></div></div><div class="city-card"><h3>Места из коллекции</h3><p class="map-sub">Нажми на город, чтобы посмотреть фотографии этого места.</p><div class="city-list">${cities.map((c,i)=>`<button class="city-item ${i===state.selectedCity?'active':''}" data-city="${i}"><img src="${ASSETS[c.img]}" alt=""><div><strong>${c.name}</strong><small>${c.desc} · ${c.count} фото</small></div><span style="margin-left:auto">${icon('chevron')}</span></button>`).join('')}</div><div style="background:#f5f8fc;border-radius:12px;padding:12px;margin-top:20px;font-size:11px;color:#7c8ba0">${icon('info')} Снимки без GPS остаются в хронологии. Место можно будет указать вручную.</div></div></div><div class="timeline-section"><div class="dateheading"><h2>${cities[state.selectedCity].name}</h2><span>Подборка по месту</span></div><div class="photos-grid">${photos.filter(p=>p.city===cities[state.selectedCity].name).slice(0,5).map(photoCard).join('')}</div></div>`}
const dupeSets=[{name:'Совпадающие кадры',desc:'Точные копии · имена и папки отличаются',images:['cat','cat_2','cat'],type:'Точные копии',count:3},{name:'Версии одной фотографии',desc:'Разные разрешения и сжатие',images:['mountain','land','mountain'],type:'Разные версии',count:3},{name:'Похожие снимки',desc:'Сняты подряд · решение остаётся за вами',images:['coffee','coffee_2','coffee'],type:'Похожие кадры',count:3},{name:'Точные повторы',desc:'Сравнение файлов по контрольной сумме',images:['sky','sky_2','sky'],type:'Точные копии',count:3}];
function dupesPage(){let sets=dupeSets.filter(g=>state.dupeFilter==='Все группы'||g.type===state.dupeFilter);return `${heading('Группы совпадений','Сравнивайте версии и похожие кадры — без удаления файлов.')}<div class="dupe-summary">${icon('shield')} <span><strong>Только рекомендации.</strong> Ни один дубликат не удаляется и не перемещается автоматически.</span></div><div class="toolbar">${['Все группы','Точные копии','Разные версии','Похожие кадры'].map(t=>`<button class="chip ${state.dupeFilter===t?'active':''}" data-dupe="${t}">${t}</button>`).join('')}</div><div class="dupe-grid">${sets.map((g,index)=>`<div class="dupe-card"><h3>${g.name}</h3><p>${g.desc}</p><div class="dupe-photo-row">${g.images.map((img,i)=>`<div><img src="${ASSETS[img]}" alt="Версия ${i+1}"><div class="dupe-caption">${i===0?'<span class="best">'+icon('check',11)+' Рекомендуется</span>':'Другая версия'}<b>${['4032 × 3024','1920 × 1440','800 × 600'][i]}</b></div></div>`).join('')}</div><div class="dupe-foot"><span>${g.count} экземпляра · файлы сохранены</span><button data-compare="${index}">Сравнить ${icon('arrow')}</button></div></div>`).join('')}</div>`}
function albumsPage(){const albums=[['Лето 2024','Сочи · 184 фотографии','mountain',2024],['Поездка 2023','Тбилиси · 89 фотографий','land',2023],['Май 2022','Санкт-Петербург · 154 фото','portrait',2022]];return `${heading('Альбомы','Подборки по событиям без физических копий файлов.')}<div class="album-grid">${albums.map(([name,desc,img,y])=>`<button class="album" data-album="${y}"><img src="${ASSETS[img]}" alt=""><div class="album-info"><b>${name}</b><p>${desc}</p></div></button>`).join('')}</div><div class="bottomdemo">В полноценной версии альбомы можно создавать вручную, а события — предлагать по времени и месту.</div>`}
function sourcesPage(){return `${heading('Источники','Все места хранения фотографий — единый виртуальный каталог.')}<div class="sources-list">${sources.map(s=>`<div class="source-card"><div class="folder-icon">${icon('folder')}</div><div><b>${s.name}</b><small>${s.path} · ${s.count}</small></div><div class="source-status ${!s.online?'offline':''}">${s.online?'● Подключён':'○ Не подключён'}</div></div>`).join('')}</div><div style="margin-top:20px;max-width:620px;color:#8795a6;font-size:12px;line-height:1.7">Даже когда внешний диск отключён, в настоящей программе сохранятся миниатюры, даты и расположение файлов. При подключении снова станут доступны оригиналы.</div><button class="btn" style="margin-top:20px" id="sourceAdd">${icon('plus')} Добавить папку</button>`}
function page(){return ({photos:photoPage,map:mapPage,duplicates:dupesPage,albums:albumsPage,sources:sourcesPage})[state.section]()} 
function detailPanel(){let p=photos.find(p=>p.id===state.detail);if(!p)return '';return `<div class="detail-shade" data-dismiss="detail"></div><aside class="detail"><div class="detail-head"><div><h2>Информация о фото</h2><small>Демонстрационные метаданные</small></div><button class="icon-btn" aria-label="Закрыть просмотр" data-close="detail">${icon('close')}</button></div><img class="detail-image" src="${ASSETS[p.img]}" alt="${p.name}"><h2>${p.name}</h2><div class="bubble">${icon('shield',14)} Исходный файл не изменён</div><hr><div class="meta-row"><span>Дата съёмки</span><b>${p.date}</b></div><div class="meta-row"><span>Место</span><b>${p.city==='Неизвестно'?'GPS не найден':p.city+', '+p.country}</b></div><div class="meta-row"><span>Разрешение</span><b>${p.res}</b></div><div class="meta-row"><span>Размер</span><b>${p.size}</b></div><div class="meta-row"><span>Исходная папка</span><b>${p.source}</b></div>${p.stack?`<hr><div style="background:#f3f7ff;padding:14px;border-radius:12px;color:#527299;font-size:12px">${icon('layers')} У этого снимка есть ещё ${p.stack-1} версии. Нажмите «Повторы», чтобы просмотреть группы.</div>`:''}</aside>`}
function modal(){if(state.modal==='compare'){const g=dupeSets[state.compareIndex];return `<div class="dim" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Сравнение фотографий</h2><p>${g.name}. Все представленные файлы сохранены.</p></div><button class="icon-btn" aria-label="Скрыть диалог" data-close="modal">${icon('close')}</button></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0">${g.images.map((im,i)=>`<div style="border:1.5px solid ${state.bestIndex===i?'#3970f7':'#e8ecf3'};border-radius:13px;padding:8px;background:${state.bestIndex===i?'#f5f8ff':'#fff'}"><img src="${ASSETS[im]}" style="width:100%;height:160px;object-fit:cover;border-radius:8px" alt="Версия ${i+1}"><div style="font-size:11px;color:#64758a;margin:12px 2px 8px">${['4032 × 3024','1920 × 1440','800 × 600'][i]}</div><button class="btn ${state.bestIndex===i?'primary':''}" style="width:100%;padding:0 6px;font-size:11px" data-choose="${i}">${state.bestIndex===i?icon('check')+' Основная':'Сделать основной'}</button></div>`).join('')}</div><div class="warning">${icon('info')} <span>Выбор основного кадра в прототипе сохраняется лишь до закрытия окна. В рабочей программе он изменит только отображение виртуального каталога, не удаляя остальные файлы.</span></div><div class="modal-actions"><button class="btn" data-close="modal">Закрыть</button></div></div></div>`}if(state.modal==='folder')return `<div class="dim" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Добавить папку</h2><p>В прототипе можно открыть изображения только для временного предпросмотра.<br>Рабочая Windows-программа будет сканировать папки и сохранять каталог.</p></div><button class="icon-btn" data-close="modal" aria-label="Скрыть диалог">${icon('close')}</button></div><div style="background:#f3f7ff;border-radius:15px;padding:23px;margin-top:24px"><b>Безопасный режим</b><p style="color:#8795a7;line-height:1.7;font-size:12px">Веб-прототип не загружает фотографии в интернет и не может перемещать или удалять файлы. После выбора папки будет доступен просмотр части изображений, но не их полный анализ.</p></div><div class="modal-actions"><button class="btn" data-close="modal">Закрыть</button><button class="btn primary" id="chooseFolder">${icon('folder')} Выбрать папку</button></div></div></div>`;
return `<div class="dim" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><h2>Собрать архив</h2><p>Одна операция — организованный архив. В рабочей версии перед изменениями появится полный план.</p></div><button class="icon-btn" aria-label="Скрыть диалог" data-close="modal">${icon('close')}</button></div><div class="mode-list"><button class="mode ${state.mode==='copy'?'selected':''}" data-mode="copy"><div class="mode-icon">${icon('copy')}</div><div><strong>Создать копии</strong><span>Оригиналы остаются в исходных папках.</span></div></button><button class="mode ${state.mode==='move'?'selected':''}" data-mode="move"><div class="mode-icon">${icon('move')}</div><div><strong>Переместить</strong><span>Собрать исходники в одном месте без постоянных дублей.</span></div></button></div><label class="field-label" for="destination">Куда собрать фотографии</label><div class="dest">${icon('folder')}<input id="destination" aria-label="Папка назначения" value="${escapeHtml(state.destination)}" placeholder="D:\\Мой фотоархив"></div><div class="archive-preview"><strong>Предварительная структура</strong><div class="archive-tree">📁 Мой фотоархив<br>&nbsp; ├── 📁 2024<br>&nbsp; │&nbsp;&nbsp; └── 📁 2024-07 Июль<br>&nbsp; │&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; └── 📁 2024-07-18<br>&nbsp; ├── 📁 2023<br>&nbsp; └── 📁 Без даты</div></div><div class="warning">${icon('info')} <span>${state.mode==='move'?'Перед перемещением программа должна проверить контрольные суммы и доступность дисков. Исходники будут затронуты только после подтверждения.':'Копирование создаст отдельный архив; файлы в исходных папках останутся без изменений.'}</span></div><div class="modal-actions"><span style="font-size:11px;color:#9da8b4;margin-right:auto">Демо: реальные файловые операции выключены</span><button class="btn" data-close="modal">Закрыть</button><button class="btn primary" id="previewPlan">${icon('check')} Посмотреть план</button></div></div></div>`}
function render(keepSearchFocus=false){const input=document.getElementById('searchInput'),pos=input?input.selectionStart:null;document.getElementById('app').innerHTML=shell();if(keepSearchFocus){const n=document.getElementById('searchInput');n.focus();if(pos!=null)n.setSelectionRange(pos,pos)}}
function renderPage(){document.getElementById('viewport').innerHTML=page();document.querySelectorAll('[data-go]').forEach(el=>el.classList.toggle('active',el.dataset.go===state.section))}
function toast(msg){const host=document.getElementById('toastHost');host.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>{if(host)host.innerHTML=''},3400)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-city],[data-dismiss]');if(!b)return;
 if(b.dataset.go){state.section=b.dataset.go;state.query='';render();return}
 if(b.id==='openArchive'){state.modal='archive';render();return}
 if(b.id==='addFolder'||b.id==='sourceAdd'){state.modal='folder';render();return}
 if(b.id==='chooseFolder'){document.getElementById('folderInput').click();return}
 if(b.dataset.year){state.year=b.dataset.year;renderPage();return}
 if(b.dataset.photo){state.detail=Number(b.dataset.id);render();return}
 if(b.hasAttribute('data-photo-card')){state.detail=Number(b.dataset.id);render();return}
 if(b.dataset.city!==undefined){state.selectedCity=Number(b.dataset.city);renderPage();return}
 if(b.dataset.dupe){state.dupeFilter=b.dataset.dupe;renderPage();return}
 if(b.dataset.compare!==undefined){state.modal='compare';state.compareIndex=Number(b.dataset.compare);state.bestIndex=0;render();return}
 if(b.dataset.choose!==undefined){state.bestIndex=Number(b.dataset.choose);render();return}
 if(b.dataset.album){state.section='photos';state.year=b.dataset.album;render();return}
 if(b.dataset.mode){state.mode=b.dataset.mode;render();return}
 if(b.id==='previewPlan'){toast('Это прототип: план показан для примера, реальные операции не запускаются.');return}
 if(b.dataset.close==='modal'||b.dataset.dismiss==='modal'&&e.target===b){state.modal=null;render();return}
 if(b.dataset.close==='detail'||b.dataset.dismiss==='detail'){state.detail=null;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const sel=e.target.selectionStart;state.query=e.target.value;state.section='photos';document.getElementById('viewport').innerHTML=page();document.querySelectorAll('[data-go]').forEach(el=>el.classList.toggle('active',el.dataset.go==='photos'));}if(e.target.id==='destination'){state.destination=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)state.modal=null;else if(state.detail)state.detail=null;else return;render()}});
document.getElementById('folderInput').addEventListener('change',e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));state.imported.forEach(p=>URL.revokeObjectURL(p.url));state.imported=files.slice(0,20).map(f=>({name:f.name,url:URL.createObjectURL(f)}));state.modal=null;state.section='photos';state.year='Все годы';state.query='';render();toast(`Показано ${state.imported.length} изображений. В прототипе они доступны только до закрытия страницы.`)});
render();
</script></body></html>
